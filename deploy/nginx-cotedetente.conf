# Configuration nginx du site Côté Détente.
# À copier sur le serveur dans /etc/nginx/sites-available/cotedetente
# (voir deploy/GUIDE-MISE-EN-LIGNE.md). Certbot ajoutera ensuite lui-même
# la partie https (port 443) et la redirection http -> https.

# Adresse sans "www" -> redirigée vers www (adresse officielle du site)
server {
    listen 80;
    server_name institut-cote-detente.fr;
    # $scheme : reste en http avant le certificat, passe en https une fois certbot passé
    return 301 $scheme://www.institut-cote-detente.fr$request_uri;
}

server {
    listen 80;
    server_name www.institut-cote-detente.fr;

    # Pages du site (build Vite)
    root /var/www/cotedetente/front/dist;
    index index.html;

    # Uploads de photos/vidéos jusqu'à 50 Mo (même limite que le back)
    client_max_body_size 50M;

    # API Node (pm2, port 5000, non exposé sur internet)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos et vidéos uploadées : servies directement par nginx (plus rapide)
    location /uploads/ {
        alias /var/www/cotedetente/back/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Fichiers JS/CSS générés par Vite : leur nom change à chaque build, cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application React : toute adresse inconnue renvoie index.html (routes du site)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
